<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <link rel='stylesheet' href='style.css'>
    <link rel='stylesheet' href='box_style.css'>
</head>
<html lang='japanese'>
    <body>
        <div class='top_io_bar' id="top_io_bar">
            <div class="topTitle">
                暗号化・復号化ツール2(β)
                <button type="button" onclick='saveBtnClicked()'>保存</button>
                <input type="file" name="" id="file_input" accept=".txt"/>
                <button type="button" onclick='copyURLClicked()'>URL</button>
            　　　注意：PC限定、未実装、バグあり
                <a href="https://github.com/subeyugi/ciphertoolgui2/blob/main/readme.md" target="_blank">使い方はこちら</a><br><br>
            </div>
            <span class='top_half'>
                <h8>入力文</h8>
                <button id="copyButton" onclick='inputCopyBtnClicked()'>コピー</button>
                <span class='top_id' id='top_input_id'>A1</span>
                <span class='top_error' id='top_input_message'></span>
                <h10>　文字数：</h10>
                <h10 class='top_id' id='top_input_length'>0</h10>
                <br>
                <textarea id='input_text' class='top_text' spellcheck='false' resize='inTextareaResized()', changed="inputBoxChanged()"></textarea>
            </span>
            <span class='top_half'>
                <h8>出力文</h8>
                <button id="copyButton" onclick='outputCopyBtnClicked()'>コピー</button>
                <span class='top_id' id='top_output_id'></span>
                <span class='top_error' id='top_output_message'></span>
                <h10>　文字数：</h10>
                <h10 class='top_id' id='top_output_length'>0</h10>
                <br>
                <textarea id='output_text' class='top_text' spellcheck='false' readonly='readonly'></textarea>
            </span>
        </div>

        <div class="main_area" id="main_area">
            <div id='cursor' class='cursorBox'>Move</div>
        </div>
        <div class="bottomOutputArea" style="display:none"> <!-- style="display:none" -->
            <div class="bottomArea">
                <h3>midi　　　　　<button type="button" class="buttom_button">midi出力</button></h3>
                <div>
                    出力タイプ　　：
                    <select id='bottomMidiType' class="bottomMidiTypeSelect", oninput="exportUpdate()">
                        <option value='morse'>モールス</option>
                        <option value='bin'>有無2進数</option>
                        <option value='base4'>左右有無4進数</option>
                        <option value='baseN'>音高n進数</option>
                        <option value='tenji'>点字</option>
                    </select>
                </div>
                <div>
                    モールス　　　：<input type="text" id="bottomMorse" class="boxSpInput" value="{A1}" oninput ="exportUpdate()"></input></br>
                    テンポ　　　　：<input type="text" id="bottomBpm" class="boxSpInput" value="132" oninput ="exportUpdate()"></input></br>
                    ・長さ　　　　：<input type="text" id="bottomShortLength" class="boxSpInput" value="1/32" oninput="exportUpdate()"></input></br>
                    －長さ　　　　：<input type="text" id="bottomLongLength" class="boxSpInput" value="3/32" oninput="exportUpdate()"></input></br>
                    短区切り長さ　：<input type="text" id="bottomSPauseLength" class="boxSpInput" value="1/32" oninput="exportUpdate()"></input></br>
                    区切り長さ　　：<input type="text" id="bottomPauseLength" class="boxSpInput" value="3/32" oninput="exportUpdate()"></input></br>
                    ノートナンバー：<input type="text" id="bottomNoteNo" class="boxSpInput" value="60" oninput="exportUpdate()"></input></br>
                </div>
            </div>
            <div class="bottomArea">
                <h3>Aviutl lua　　<button type="button" onclick="outputLuaClicked()">lua変換</button></h3>
                <div>
                    描画　　　　　：
                    <select id='bottomDrawType' class="bottomMidiTypeSelect">
                        <option value='text'>テキスト</option>
                        <option value='figure'>図形</option>
                        <option value='image'>画像</option>
                        <option value='movie'>動画</option>
                    </select></br>
                    終了タイミング：<select id='bottomEndType' class="bottomMidiTypeSelect", oninput="exportUpdate()">
                        <option value='end'>音終了時</option>
                        <option value='nextStart'>次の音開始時</option>
                        <option value='none'>なし</option>
                    </select></br>
                    テキスト　　　：<input type="text" id="bottomText" class="boxSpInput" value="text"></input></br>
                    Ⅹ　　　　　　：<input type="text" id="bottomX" class="boxSpInput" value="0"></input></br>
                    Ｙ　　　　　　：<input type="text" id="bottomY" class="boxSpInput" value="0"></input></br>
                    開始時間　　　：<input type="text" id="bottomStart" class="boxSpInput" value="0"></input></br>
                    終了時間　　　：<input type="text" id="bottomEnd" class="boxSpInput" value="10"></input></br>
                    ファイル　　　：<input type="text" id="bottomFile" class="boxSpInput" value="input"></input> .
                    <input type="text" id="bottomFileExt" class="boxSpInput inputSmall" value="avi"></input></br>
                </div>
            </div>
            <div class="bottomArea"><textarea class="bottom_textarea" id="luaOutput" spellcheck="false"></textarea></div>
        </div>

        <script src="src/variables.js"></script>
        <script src="https://unpkg.com/@tonejs/midi"></script> <!-- https://github.com/Tonejs/Midi -->
        <script src="src/errorIndication.js"></script>
        <script src='src/class.js'></script>
        <script src="lib/encoding.min.js"></script>
        <script src='src/converter.js'></script>
        <script src='src/charCounter.js'></script>
        <script src="src/midiReader.js"></script>
        <script src="cipher_convert/morseConverter.js"></script>
        <script src="cipher_convert/stringConverter.js"></script>
        <script src="cipher_convert/twoTouchConverter.js"></script>
        <script src="cipher_convert/caesarConverter.js"></script>
        <script src="cipher_convert/mikakaConverter.js"></script>
        <script src="cipher_convert/calcConverter.js"></script>
        <script src="cipher_convert/charcodeConverter.js"></script>
        <script src="cipher_convert/reverseConverter.js"></script>
        <script src="cipher_convert/baseConverter.js"></script>
        <script src="cipher_convert/charNumberConverter.js"></script>
        <script src="cipher_convert/atbashConverter.js"></script>
        <script src="cipher_convert/vigenereConverter.js"></script>
        <script src="cipher_convert/dakutenConverter.js"></script>
        <script src="cipher_convert/tenjiConverter.js"></script>
        <script src="cipher_convert/polybiusConverter.js"></script>
        <script src="cipher_convert/formatConvert.js"></script>
        <script src="cipher_convert/railFenceConvert.js"></script>
        <script src="cipher_convert/scytaleConverter.js"></script>
        <script src="cipher_convert/splitConverter.js"></script>
        <script src="cipher_convert/arrayConverter.js"></script>
        <script src="src/export.js"></script>
        <script src='src/init.js'></script>
        <script src="src/script.js"></script>
    </body>
</html>
